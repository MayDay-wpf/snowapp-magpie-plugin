name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: node --check agent.mjs
      - run: node --check hooks.mjs
      - run: node --check sync.mjs
      - run: bun test
